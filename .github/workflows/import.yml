name: Importar do Apps Script

# Puxa o código atual do editor do Apps Script para a pasta src/ e faz commit.
# Use na primeira vez ou se alguém editar direto no editor do Google.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: ./scripts/setup-clasp.sh

      - name: Baixar código (clasp pull)
        run: clasp pull

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "Nada mudou no Apps Script."
          else
            git commit -m "chore: importa código do Apps Script"
            git push
          fi
